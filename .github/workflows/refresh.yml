name: refresh-cards

on:
  schedule:
    - cron: "17 18 * * *"        # daily, 23:47 IST
  workflow_dispatch: {}           # "Run workflow" button in the Actions tab
  push:
    paths: ["data/**", "scripts/**", "fonts/**", "source-photo.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow fonttools
      - name: Generate cards
        run: python scripts/build.py
        env:
          GH_USER: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name  "silicon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets data/contribs-cache.json
          git diff --cached --quiet || (git commit -m "chore: refresh cards" && git push)
